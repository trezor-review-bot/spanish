<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Español">
<meta name="theme-color" content="#FFC300">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Spanish flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEFF6;--card:#fff;--ink:#1F2140;--muted:#5C6082;--sun:#FFC300;--line:#D5D9E6;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#14152A;--card:#20224A;--ink:#EDEEF7;--muted:#A3A7C8;--sun:#FFCD33;--line:#33366A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 48px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(30px,9vw,44px);line-height:1.05;margin:0 0 6px;letter-spacing:-.02em}
h1 span{background:var(--sun);color:#1F2140;padding:0 .18em;border-radius:6px}
p{color:var(--muted);margin:0 0 22px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
a.ep{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;color:inherit;text-decoration:none}
a.ep:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.t{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:20px;line-height:1.2}
.s{font-size:14px;color:var(--muted);margin-top:2px}
.msg{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Spanish <span>flashcards</span></h1>
  <p>One deck per podcast episode, with the hosts' real voices.</p>
  <ul id="list"><li class="msg">Loading episodes…</li></ul>
</div>
<script>
// Finds every file in /episodes automatically, so adding an episode = uploading one file.
const host = location.hostname.split(".")[0];
const repo = location.pathname.split("/").filter(Boolean)[0] || "";
const list = document.getElementById("list");
async function titleOf(url){
  try{
    const r = await fetch(url, {headers:{Range:"bytes=0-3000"}});
    const t = (await r.text()).match(/<title>([^<]*)<\/title>/);
    return t ? t[1].replace(/\s+—\s+flashcards$/,"") : null;
  }catch(_){ return null; }
}
function pretty(name){
  const m = name.replace(/\.html$/,"").match(/^(s\d+e\d+)-?(.*)$/i);
  const words = (m ? m[2] : name).replace(/-/g," ");
  return (m ? m[1].toUpperCase()+": " : "") + words.charAt(0).toUpperCase()+words.slice(1);
}
function render(eps){
  if(!eps.length){ list.innerHTML = '<li class="msg">No episodes yet. Upload a file into the episodes folder.</li>'; return; }
  list.innerHTML = eps.map(e=>`<li><a class="ep" href="episodes/${e.file}"><div class="t">${e.title}</div><div class="s">${e.code}</div></a></li>`).join("");
}
(async()=>{
  let eps = [];
  try{
    const r = await fetch(`https://api.github.com/repos/${host}/${repo}/contents/episodes`);
    if(!r.ok) throw new Error(r.status);
    const files = (await r.json()).filter(f=>f.name.endsWith(".html")).map(f=>f.name).sort();
    eps = await Promise.all(files.map(async f=>({
      file:f,
      code:(f.match(/^s\d+e\d+/i)||[""])[0].toUpperCase(),
      title:(await titleOf("episodes/"+f)) || pretty(f)
    })));
    localStorage.setItem("es-fc:episodes", JSON.stringify(eps));
  }catch(_){
    try{ eps = JSON.parse(localStorage.getItem("es-fc:episodes")) || []; }catch(__){}
  }
  render(eps);
})();
</script>
</body>
</html>
